---
# Example playbook to install RHACM using OLM v1
#
# Usage:
#   ansible-playbook -i localhost, install-rhacm.yml
#
# With custom kubeconfig:
#   KUBECONFIG=/path/to/kubeconfig ansible-playbook -i localhost, install-rhacm.yml

- name: Install Red Hat Advanced Cluster Management using OLM v1
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # Uncomment and modify these variables as needed
    # rhacm_namespace: open-cluster-management
    # rhacm_channel: release-2.13
    # rhacm_mch_enable_search_v2: true
    # rhacm_mch_availability_config: High

  pre_tasks:
    - name: Verify OpenShift connection
      kubernetes.core.k8s_cluster_info:
      register: cluster_info

    - name: Display cluster version
      ansible.builtin.debug:
        msg: "Installing RHACM on OpenShift {{ cluster_info.version.server.kubernetes.gitVersion }}"

  roles:
    - role: ../../olmv1-acm
      # Or if installed via ansible-galaxy:
      # - role: rhacm-olmv1

  post_tasks:
    - name: Wait for all ACM components to be ready
      ansible.builtin.pause:
        seconds: 30
        prompt: "Waiting for ACM components to stabilize..."

    - name: List all ACM pods
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ acm_namespace | default('open-cluster-management') }}"
      register: acm_pods

    - name: Display pod status
      ansible.builtin.debug:
        msg: "Found {{ acm_pods.resources | length }} ACM pods in {{ acm_namespace | default('open-cluster-management') }} namespace"
