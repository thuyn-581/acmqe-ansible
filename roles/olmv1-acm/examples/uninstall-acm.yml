---
# Playbook to uninstall RHACM installed via OLM v1
#
# Usage:
#   ansible-playbook -i localhost, uninstall-rhacm.yml

- name: Uninstall Red Hat Advanced Cluster Management
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    acm_namespace: ocm
    acm_cluster_extension_name: advanced-cluster-management
    acm_mch_name: multiclusterhub

  tasks:
    - name: Delete MultiClusterHub instance
      kubernetes.core.k8s:
        api_version: operator.open-cluster-management.io/v1
        kind: MultiClusterHub
        name: "{{ acm_mch_name }}"
        namespace: "{{ acm_namespace }}"
        state: absent
        wait: true
        wait_timeout: 600

    - name: Wait for MultiClusterHub to be deleted
      kubernetes.core.k8s_info:
        api_version: operator.open-cluster-management.io/v1
        kind: MultiClusterHub
        name: "{{ acm_mch_name }}"
        namespace: "{{ acm_namespace }}"
      register: mch_check
      until: mch_check.resources | length == 0
      retries: 60
      delay: 10

    - name: Delete ClusterExtension
      kubernetes.core.k8s:
        api_version: olm.operatorframework.io/v1
        kind: ClusterExtension
        name: "{{ acm_cluster_extension_name }}"
        state: absent
        wait: true
        wait_timeout: 300

    - name: Wait for operator deployment to be deleted
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        namespace: "{{ acm_namespace }}"
        label_selectors:
          - "app=multiclusterhub-operator"
      register: operator_deployment
      until: operator_deployment.resources | length == 0
      retries: 30
      delay: 10

    - name: Delete RHACM namespace (optional)
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: "{{ acm_namespace }}"
        state: absent
        wait: true
        wait_timeout: 300
      when: delete_namespace | default(false) | bool

    - name: Display completion message
      ansible.builtin.debug:
        msg:
          - "RHACM uninstallation completed"
          - "ClusterExtension deleted: {{ acm_cluster_extension_name }}"
          - "MultiClusterHub deleted: {{ acm_mch_name }}"
          - "Namespace preserved: {{ acm_namespace }} (use -e delete_namespace=true to remove)"
