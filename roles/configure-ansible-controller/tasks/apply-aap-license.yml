---
- name: Download AAP license manifest
  block:
  - name: Generate RHSM refresh token
    uri:
      url: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token 
      method: POST
      body_format: form-urlencoded       
      body:
        grant_type: refresh_token
        client_id: rhsm-api
        refresh_token: "{{ rhsm_token }}"
      return_content: yes
    register: token
    until: "'access_token' in token.content"
    retries: 12
    delay: 5 
    
  # - debug: 
  #     msg: "{{ token.json.access_token }}"   
  
  - name: Get manifest export jobID url
    uri:
      url: https://api.access.redhat.com/management/v1/allocations/{{ sub_alloc_uuid }}/export
      headers: 
        Authorization: "Bearer {{ token.json.access_token }}"
      return_content: yes
    register: exportJob
    until: "'href' in exportJob.content"
    retries: 12
    delay: 5 

  - debug: 
      msg: "{{ exportJob.json.body.href }}"  

  - name: Get manifest download link 
    uri:
      url: "{{ exportJob.json.body.href }}"
      headers: 
        Authorization: "Bearer {{ token.json.access_token }}"
      return_content: yes
    register: manifest
    until: "'href' in manifest.content"
    retries: 12
    delay: 5 

  - debug: 
      msg: "{{ manifest.json.body.href }}"       
    
  - name: Download manifest file
    get_url:
      url: "{{ manifest.json.body.href }}"
      dest: "./manifest.zip"
      headers: 
        Authorization: "Bearer {{ token.json.access_token }}"
      validate_certs: false  
    register: download_result
    until: download_result is succeeded
    retries: 12
    delay: 5        

# - debug: 
#     msg: "{{ aap_url.stdout }}"         

- name: Read manifest file as base64
  shell: base64 -w0 ./manifest.zip
  register: manifest_b64
  changed_when: false

- name: Set AAP license using manifest file
  uri:
    url: "https://{{ aap_url.stdout }}/api/controller/v2/config/"
    method: POST
    user: "admin"
    password: "{{ aap_pwd.stdout }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      manifest: "{{ manifest_b64.stdout }}"
      eula_accepted: true
    status_code: [200, 201]
  register: result
  until: result is not failed
  retries: 3
  delay: 15

