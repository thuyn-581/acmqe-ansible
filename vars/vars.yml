#ocp creds
ocp_api_url: ""
ocp_user: "kubeadmin"
ocp_pwd: "" 

#service account
sa: "automation-service-account"
sa_ns: "default"

#misc
oc_cmd: "oc --insecure-skip-tls-verify=true"
project_name: "acmqe-ansible"
certs_dir: "./certs"
http_proxy: ""
skip_ansible_runner: false
cleanup: false

#tower
tower: "https://ansible.qe.red-chesterfield.com"
tower_pwd: ""
tower_user: "thnguyen"
job_name: ""

#capi
capi_namespace: "capi"
infra_providers:
  aws:
    region: "us-east-1"
    instance_type: "t3.large"
    version: "1.36.2"
    nodes_count: 2
    # /usr/local/bin/aws eks describe-cluster-versions --query "clusterVersions[*].[clusterVersion,kubernetesPatchVersion, clusterVersionStatus, supportType]" --output table
  gcp:
    region: "us-east1"
    instance_type: "n1-standard-8"
    version: "1.35.5"
    nodes_count: 2
    # gcloud container get-server-config --region=us-east1 --format="table(validMasterVersions)"
  azure:
    region: "centralus"
    instance_type: "Standard_D2s_v3"
    version: "1.36.1"
    nodes_count: 2
    # az aks get-versions --location centralus --query "values[?version=='1.36'].patchVersions.keys(@) | [-1]" --output tsv

#===== Minio =====
minio_url: http://minio-api.apps.int.prod-scale-spoke1-aws-us-east-1.itup.redhat.com
minio_alias: qe_minio
minio_user: minio
minio_pwd: minio123