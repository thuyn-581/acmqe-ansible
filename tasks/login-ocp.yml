- name: Set auth_type default
  set_fact:
    auth_type: "{{ auth_type | default('oauth') }}"

- name: Login openshift via oauth at {{ ocp_api_url }}
  shell: |
    oc --insecure-skip-tls-verify=true login -u {{ ocp_user }} -p {{ ocp_pwd }} {{ ocp_api_url }}     
  register: task_result
  until: task_result.rc == 0
  retries: 5
  delay: 30
  when: auth_type == "oauth"

- name: Login openshift via token at {{ ocp_api_url }}
  shell: |
    oc --insecure-skip-tls-verify=true login -s {{ ocp_api_url }} --token {{ sa_token }}
  register: task_result
  until: task_result.rc == 0
  retries: 5
  delay: 30
  when: auth_type == "token"

